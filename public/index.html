<!-- public/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>✨ Firebase Demo ✨</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(45deg, #FF61D8, #6B8AFF);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .emoji {
            font-size: 3rem;
            margin: 1rem 0;
        }

        .tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.9rem;
            margin: 0.5rem;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🚀</div>
        <h1>This is the Main Site</h1>
        <p>This is the Main Site</p>
        
        <div>
            <span class="tag">#Firebase</span>
            <span class="tag">#Vibes</span>
            <span class="tag">#NoCapFr</span>
        </div>
    </div>
</body>
</html>
